<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TH3 BUNNY M.</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f8fc;--card:#eef4ff;--white:#fff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--blue:#2563eb;--blue-soft:#60a5fa;--ok:#16a34a;--bad:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#111b2e;--white:#16223a;--ink:#f1f5f9;--mute:#94a3b8;--line:#243350;--blue:#60a5fa;--blue-soft:#2563eb}}
*{box-sizing:border-box;margin:0}
body{font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.5px;margin:8px 0 20px}
.brand i{width:34px;height:34px;border-radius:10px;background:var(--blue);color:#fff;display:grid;place-items:center;font-style:normal;font-size:18px}
.brand b{color:var(--blue)}
.panel{background:var(--card);border:1.5px solid var(--blue-soft);border-radius:20px;padding:20px;margin-bottom:18px}
h2{font-size:17px;margin-bottom:14px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--mute);margin:12px 0 5px}
input{width:100%;font:inherit;font-size:15px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--white);color:var(--ink);outline:none}
input:focus{border-color:var(--blue)}
.btn{font:inherit;font-weight:600;font-size:14px;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;background:var(--blue);color:#fff;text-decoration:none;display:inline-block}
.btn.full{width:100%;margin-top:18px;padding:14px;font-size:15px}
.btn.ghost{background:transparent;color:var(--blue);border:1.5px solid var(--blue-soft)}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn.sm{padding:8px 12px;font-size:12.5px;border-radius:10px}
.btn.ok{background:var(--ok);opacity:1;cursor:default}
.btn:disabled{opacity:.7}
.btn.ok:disabled{opacity:1}
.msg{font-size:13px;color:var(--bad);margin-top:10px;min-height:18px}
.item{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.amt{font-size:22px;font-weight:700}
.tag{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:99px;white-space:nowrap}
.tag.active{background:#dcfce7;color:var(--ok)}.tag.expired{background:#fee2e2;color:var(--bad)}.tag.paid{background:#dbeafe;color:var(--blue)}
.meta{font-size:12.5px;color:var(--mute);margin-top:4px;line-height:1.6}
.url{font-size:12px;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:8px 10px;margin-top:10px;word-break:break-all;color:var(--blue)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.empty{text-align:center;color:var(--mute);font-size:14px;padding:22px 8px}
.note{font-size:12px;color:var(--mute);line-height:1.6;margin-top:6px}
.stage{min-height:100vh;display:grid;place-items:center;padding:24px 20px}
.pay{position:relative;width:100%;max-width:440px}
.pay::before{content:"";position:absolute;inset:36px -16px -16px 18px;background:var(--blue-soft);border-radius:26px}
.card{position:relative;background:var(--card);border:1.5px solid var(--blue-soft);border-radius:26px;padding:28px 22px 22px}
.total-l{font-size:12.5px;font-weight:600;color:var(--mute);margin-top:22px}
.total{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1.1}
.total small{font-size:15px;color:var(--mute);font-weight:600;letter-spacing:0;margin-left:6px}
.qrbox{background:var(--white);border-radius:22px;padding:22px 16px;margin-top:20px;text-align:center;border:1px solid var(--line)}
#qr{display:inline-block;background:#fff;padding:12px;border-radius:16px;border:1px solid var(--line)}
#qr img{display:block;width:200px;height:200px}
.scan{font-size:12.5px;font-weight:600;color:var(--mute);margin:12px 0}
.row{display:flex;justify-content:space-between;gap:12px;padding:15px 4px;border-bottom:1px solid var(--line);font-size:15px}
.row:last-child{border:0}.row>span:first-child{color:var(--mute)}.row>span:last-child{font-weight:600;text-align:right;word-break:break-all}
.badge{background:var(--card);border:1.5px solid var(--blue-soft);color:var(--blue);border-radius:99px;padding:6px 14px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.badge::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor;animation:p 1.4s infinite}
.badge.done{color:var(--ok);border-color:var(--ok)}.badge.done::before{animation:none}
@keyframes p{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.badge::before{animation:none}}
.foot{text-align:center;font-size:13px;color:var(--mute);margin-top:12px}
.dead-box{padding:34px 10px;color:var(--mute);font-weight:600;text-align:center;line-height:1.6}
dialog{border:0;border-radius:18px;padding:20px;width:min(92vw,400px);max-height:88vh;overflow:auto;background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=ms=>new Date(ms).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
const inr=n=>Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const toLocalInput=ms=>new Date(ms-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
const BRAND='<div class="brand" style="margin:0"><i>₹</i><span>TH3 <b>BUNNY</b> M.</span></div>';
const view=h=>$('#app').innerHTML=`<div class="stage"><div class="pay"><div class="card">${BRAND}${h}</div></div></div>`;

async function API(path,opt={}){
  const r=await fetch(path,{...opt,headers:{'content-type':'application/json'}});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||'Error');return j;
}
function route(){
  const m=location.pathname.match(/^\/pay\/([A-Za-z0-9]{8})\/?$/)||location.search.match(/[?&]pay=([A-Za-z0-9]{8})/);
  m?payPage(m[1]):dashboard();
}

/* ---------- DASHBOARD ---------- */
let editing=null,poll=null,links=[],recent={},gone={};
const HOLD=120000;
// KV list/get kuch der purana data de sakta hai, isliye abhi ke changes local me 2 min tak pakad ke rakhte hain
function merge(srv){
  const now=Date.now();
  for(const k in recent)if(recent[k].until<now)delete recent[k];
  for(const k in gone)if(gone[k]<now)delete gone[k];
  const m=new Map(srv.filter(l=>!gone[l.id]).map(l=>[l.id,l]));
  for(const k in recent){const s=m.get(k);if(!s||!s.paid)m.set(k,{...(s||{}),...recent[k].link})}
  return [...m.values()].sort((a,b)=>b.created-a.created);
}
function dashboard(){
  document.title='Payment links — TH3 BUNNY M.';
  $('#app').innerHTML=`<div class="wrap"><div class="brand"><i>₹</i><span>TH3 <b>BUNNY</b> M.</span></div>
  <div class="panel"><h2>Create payment link</h2>
    <label>Amount (₹)</label><input id="amt" type="number" min="1" step="0.01" inputmode="decimal" placeholder="499.00">
    <label>Merchant name</label><input id="mer" maxlength="40" placeholder="Mr BUNNY M.">
    <label>Expiry date &amp; time</label><input id="exp" type="datetime-local">
    <button class="btn full" id="gen">Generate link</button><div class="msg" id="msg"></div></div>
  <div class="panel"><div class="top"><h2>Your links <span id="cnt" style="color:var(--mute);font-weight:500"></span></h2><button class="btn sm ghost" id="ref">Refresh</button></div><div id="list"></div></div></div>
  <dialog id="dlg"><h2>Change expiry</h2><label>New expiry date &amp; time</label><input id="nexp" type="datetime-local">
    <div class="acts"><button class="btn" id="dsave">Save</button><button class="btn ghost" id="dcancel">Cancel</button></div></dialog>
  <dialog id="ddlg"><h2>Transaction details</h2><div id="dbody"></div>
    <div class="acts"><a class="btn sm" id="rcpt" target="_blank" rel="noopener" hidden>Download receipt (PDF)</a><button class="btn sm ghost" id="dclose">Close</button></div></dialog>`;
  $('#exp').value=toLocalInput(Date.now()+864e5);$('#mer').value=localStorage.getItem('bm_mer')||'';
  $('#gen').onclick=async()=>{
    const merchant=$('#mer').value.trim(),amount=parseFloat($('#amt').value),expires=new Date($('#exp').value).getTime();
    const err=!(amount>=1)?'Amount kam se kam ₹1 ho.':!merchant?'Merchant name daalo.':!(expires>Date.now())?'Expiry future ki honi chahiye.':'';
    $('#msg').textContent=err;if(err)return;
    const b=$('#gen');b.disabled=true;b.textContent='Creating…';
    try{const l=await API('/api/admin/links',{method:'POST',body:JSON.stringify({amount,merchant,expires})});
      localStorage.setItem('bm_mer',merchant);$('#amt').value='';
      recent[l.id]={link:l,until:Date.now()+HOLD};links=merge([...links,l]);render()}
    catch(e){$('#msg').textContent=e.message}
    b.disabled=false;b.textContent='Generate link';
  };
  $('#dsave').onclick=async()=>{const t=new Date($('#nexp').value).getTime();if(!(t>0))return;
    try{const l=await API('/api/admin/links/'+editing,{method:'PATCH',body:JSON.stringify({expires:t})});
      $('#dlg').close();recent[l.id]={link:l,until:Date.now()+HOLD};links=merge(links);render()}catch(e){alert(e.message)}};
  $('#dcancel').onclick=()=>$('#dlg').close();
  $('#dclose').onclick=()=>$('#ddlg').close();
  $('#ref').onclick=load;
  load();clearInterval(poll);poll=setInterval(()=>{if(!document.hidden)load()},60000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&$('#list'))load()});
}
async function load(){
  try{links=merge(await API('/api/admin/links'))}catch(e){return}
  render();
}
function render(){
  if(!$('#list'))return;
  $('#cnt').textContent=links.length?`(${links.length})`:'';
  $('#list').innerHTML=links.length?links.map(l=>{
    const st=l.paid?'paid':l.expires>Date.now()?'active':'expired';
    const acts=l.paid
      ?`<button class="btn sm ok" disabled>✓ Success</button><button class="btn sm ghost" data-a="det" data-id="${l.id}">See details</button>`
      :`<button class="btn sm" data-a="copy" data-id="${l.id}">Copy link</button>
        <button class="btn sm ghost" data-a="open" data-id="${l.id}">Open</button>
        <button class="btn sm ghost" data-a="edit" data-id="${l.id}">Change expiry</button>
        <button class="btn sm danger" data-a="del" data-id="${l.id}">Delete</button>`;
    return `<div class="item"><div class="top"><div><div class="amt">₹${inr(l.amount)}</div>
    <div class="meta">${esc(l.merchant)} · ID ${l.id}<br>Created ${fmt(l.created)}<br>Expires ${fmt(l.expires)}${l.paid?`<br>Paid ${fmt(l.paidAt)}${l.sender?' by '+esc(l.sender):''}<br>UTR ${esc(l.utr||'—')}`:''}</div></div>
    <span class="tag ${st}">${{paid:'Paid',active:'Active',expired:'Expired'}[st]}</span></div>
    <div class="url">${esc(location.origin+'/pay/'+l.id)}</div><div class="acts">${acts}</div></div>`}).join(''):'<div class="empty">Abhi koi link nahi hai. Upar form bharke pehla link banao.</div>';
  $('#list').querySelectorAll('button[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a,b.dataset.id,b));
}
function showDetails(l){
  const R=(k,v)=>`<div class="row"><span>${k}</span><span>${v}</span></div>`;
  $('#dbody').innerHTML=R('Status','<span class="badge done">Success</span>')+R('Amount','₹'+inr(l.amount))+R('Amount paid','₹'+inr(l.payable||l.amount))
    +R('Merchant',esc(l.merchant))+R('Payer name',esc(l.sender||'—'))+R('UTR',esc(l.utr||'—'))+R('Transaction ID',esc(l.txn||'—'))
    +R('Order ID',esc(l.orderId||'—'))+R('Link ID',l.id)+R('Paid at',fmt(l.paidAt)+(l.payTime?'<br><small>'+esc(l.payTime)+' (gateway)</small>':''))
    +R('Link created',fmt(l.created))+R('Link expiry',fmt(l.expires));
  const r=$('#rcpt');if(l.orderId){r.href='https://famgateway.in/transaction-details.php?id='+encodeURIComponent(l.orderId)+'&download=pdf';r.hidden=false}else r.hidden=true;
  $('#ddlg').showModal();
}
async function act(a,id,btn){
  const l=links.find(x=>x.id===id),url=location.origin+'/pay/'+id;if(!l)return;
  if(a==='copy')navigator.clipboard.writeText(url).then(()=>{btn.textContent='Copied';setTimeout(()=>btn.textContent='Copy link',1500)},()=>prompt('Copy link:',url));
  if(a==='open')window.open(url,'_blank');
  if(a==='det')showDetails(l);
  if(a==='edit'){editing=id;$('#nexp').value=toLocalInput(l.expires);$('#dlg').showModal()}
  if(a==='del'&&confirm('Ye link delete karna hai?')){
    gone[id]=Date.now()+HOLD;links=links.filter(x=>x.id!==id);render();
    try{await API('/api/admin/links/'+id,{method:'DELETE'})}catch(e){delete gone[id];alert(e.message);load()}
  }
}

/* ---------- PAY PAGE ---------- */
let timers=[];const clearT=()=>{timers.forEach(clearInterval);timers=[];checkFn=null};
const paidView=d=>view(`<div class="total-l">PAYMENT RECEIVED</div><div class="total" style="color:var(--ok)">₹${inr(d.amount)}</div>
  <div style="margin-top:14px"><div class="row"><span>Merchant</span><span>${esc(d.merchant)}</span></div>
  <div class="row"><span>UTR</span><span>${esc(d.utr||'—')}</span></div>
  <div class="row"><span>Verification</span><span><span class="badge done">Paid</span></span></div></div><div class="foot">Powered by <b>TH3 BUNNY M.</b></div>`);
let checkFn=null,busy=false;
const kick=()=>{if(checkFn&&!document.hidden)checkFn()};
document.addEventListener('visibilitychange',kick);window.addEventListener('focus',kick);window.addEventListener('pageshow',kick);
const dead=t=>view(`<div class="dead-box">${t}</div>`);
async function payPage(id){
  document.title='Pay — TH3 BUNNY M.';clearT();
  let d;
  try{
    const r=await fetch('/api/pay/'+id);
    if(r.status===404)return dead('Ye payment link maujood nahi hai ya delete ho chuka hai.');
    if(!r.ok)throw 0;d=await r.json();
  }catch(e){dead('Payment gateway se connect nahi ho paya. Thodi der baad page refresh karo.');return}
  if(d.state==='expired')return dead('Ye payment link expire ho chuka hai.');
  if(d.state==='paid')return paidView(d);
  const o=d.order;
  view(`<div class="total-l">ORDER TOTAL</div><div class="total">₹${inr(o.pay)}<small>INR</small></div>
    <div class="qrbox"><div id="qr"><img src="${esc(o.qr)}" alt="UPI QR code"></div><div class="scan">Scan with any UPI app</div>
    <div class="acts" style="justify-content:center"><a class="btn sm ghost" href="${esc(o.qr)}" target="_blank" rel="noopener">Save QR</a><a class="btn sm" href="${esc(o.intent)}">Pay with UPI app</a></div></div>
    <div style="margin-top:14px"><div class="row"><span>Merchant</span><span>${esc(d.merchant)}</span></div>
    <div class="row"><span>Order ID</span><span>${esc(o.id)}</span></div>
    <div class="row"><span>Expires in</span><span id="cd">--</span></div>
    <div class="row"><span>Verification</span><span><span class="badge">Waiting for payment…</span></span></div></div>
    <div class="foot">Powered by <b>TH3 BUNNY M.</b></div>`);
  const pad=n=>String(n).padStart(2,'0');
  const tick=()=>{const left=d.expires-Date.now();if(left<=0){clearT();return payPage(id)}
    const s=Math.floor(left/1e3),dd=Math.floor(s/86400);
    $('#cd').textContent=(dd?dd+'d ':'')+pad(Math.floor(s%86400/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60)};
  tick();timers.push(setInterval(tick,1000));
  checkFn=async()=>{
    if(busy)return;busy=true;
    try{const s=await(await fetch('/api/pay/'+id+'/status',{cache:'no-store'})).json();
      if(s.state==='paid'){clearT();paidView(s)}else if(s.state!=='pending'){clearT();payPage(id)}}catch(e){}
    busy=false};
  checkFn();timers.push(setInterval(()=>checkFn&&checkFn(),2000));
}
route();
</script>
</body>
</html>
